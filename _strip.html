<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#050505;color:#fff;font:12px/1.4 monospace}
  #info{padding:6px 8px;color:#e8b84b}
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px}
  figure{margin:0;position:relative;background:#111}
  canvas{width:100%;display:block}
  figcaption{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.7);padding:2px 5px;font-size:11px}
</style></head>
<body>
<div id="info">loading…</div>
<div class="strip" id="strip"></div>
<video id="v" src="_vid2.mp4" muted playsinline webkit-playsinline style="display:none"></video>
<script>
(async () => {
  const v = document.getElementById('v');
  const strip = document.getElementById('strip');
  const info = document.getElementById('info');
  try {
    await new Promise((res) => {
      if (v.readyState >= 1) res();
      else v.addEventListener('loadedmetadata', res, { once: true });
    });
    info.textContent = 'dur=' + v.duration.toFixed(2) + 's  ' + v.videoWidth + 'x' + v.videoHeight;
    const dur = v.duration;
    const count = 16;
    for (let i = 0; i < count; i++) {
      const t = (i / (count - 1)) * Math.max(0.05, dur - 0.06);
      await new Promise((res) => {
        v.addEventListener('seeked', res, { once: true });
        v.currentTime = t;
      });
      const fig = document.createElement('figure');
      const c = document.createElement('canvas');
      const scale = 470 / v.videoWidth;
      c.width = 470;
      c.height = Math.round(v.videoHeight * scale);
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      const cap = document.createElement('figcaption');
      cap.textContent = t.toFixed(2) + 's';
      fig.append(c, cap);
      strip.append(fig);
    }
    document.title = 'done';
  } catch (error) {
    info.textContent = 'error: ' + error.message;
  }
})();
</script>
</body></html>
