<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>real</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080a08; }
  iframe { display: block; width: 100vw; height: 100vh; border: 0; }
</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var sel = params.get("sel") || "";
    var off = Number(params.get("off") || 0);
    var frame = document.getElementById("f");

    function run() {
      var win = frame.contentWindow;
      var doc = win.document;
      var el = sel ? doc.querySelector(sel) : null;
      var top = el ? el.getBoundingClientRect().top + win.scrollY + off : off;
      win.scrollTo(0, top);
      // second nudge so observers settle on the final position
      setTimeout(function () { win.scrollTo(0, top); }, 500);
      var click = params.get("click");
      if (click) {
        setTimeout(function () {
          var target = doc.querySelector(click);
          if (target) target.click();
        }, 900);
      }
    }

    function start() { setTimeout(run, 2600); }
    if (frame.contentWindow && frame.contentWindow.document.readyState === "complete") start();
    else frame.addEventListener("load", start);
  })();
</script>
</body>
</html>
